name: Static Analysis

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - develop
      - main
      - 'releases/*'

jobs:
  phpstan:
    name: PHPStan (nivel 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan
        run: composer analyse

  deptrac:
    name: Deptrac (arquitectura por capas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Deptrac
        run: composer deptrac
